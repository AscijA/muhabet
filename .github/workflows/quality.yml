name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:rules
      - run: npm run test:e2e
      - run: npm run build
        env:
          VITE_API_KEY: ci-placeholder
          VITE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_PROJECT_ID: ci-placeholder
          VITE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_MESSAGING_SENDER_ID: "000000000000"
          VITE_APP_ID: "1:000000000000:web:placeholder"
